version: "3.8"
services:
    app:
        build: .
        container_name: node_app
        ports:
          - "3000:3000"
        environment:
          - DB_HOST=db
          - DB_USER=postgres
          - DB_PASSWORD=my_secure_password_123
          - DB_NAME=mydatabase
          - PORT=3000
        depends_on:
            db:
                condition: service_healthy
    db:
        image: postgres:15
        container_name: postgres_db
        ports:
          - "5432:5432"
        environment:
          - POSTGRES_USER=postgres
          - POSTGRES_PASSWORD=my_secure_password_123
          - POSTGRES_DB=mydatabase
        volumes:
          - pg_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d mydatabase"]
            interval: 5s
            timeout: 5s
            retries: 5
volumes:
    pg_data: