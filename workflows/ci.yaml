name: CI Pipeline

on:
    push:
        branches:
            - main
jobs:
    build:
        runs-on: ubuntu-latest
        defaultas:
            run:
                working-directory: .\lastname-node-ci\lastname-node-ci
        steps:
            - name: Checkout repository
            uses: actions/checkout@v4
            
            - name: Set up Node.js
            uses: actions/setup-node@v4
            with:
                node-version: "20"
                cache: "npm"
                #cache-dependency-path:
            - name: Install dependencies
            run: npm run build
            
            - name: Build project
            run: npm run build
            
            - name: Upload build artifact
            uses: actions/upload-artifact@v4
            with:
                name: build-output
                path: dist # Не забудь замінити на правельне
            